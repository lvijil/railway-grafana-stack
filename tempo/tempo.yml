server:
  http_listen_port: 3200
  log_level: warn

usage_report:
  reporting_enabled: false

query_frontend:
  response_consumers: 1
  max_outstanding_per_tenant: 20
  max_batch_size: 1
  search:
    concurrent_jobs: 5

querier:
  max_concurrent_queries: 1

ingester:
  max_block_bytes: 5000000
  max_block_duration: 2m
  complete_block_timeout: 30s

storage:
  trace:
    backend: local
    blocklist_poll: 1m
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces
    pool:
      max_workers: 4
      queue_depth: 100
    search:
      prefetch_trace_count: 20
      read_buffer_count: 2
      read_buffer_size_bytes: 262144

distributor:
  log_received_spans:
    enabled: false
  max_attribute_bytes: 1024
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 5000000
      burst_size_bytes: 10000000
      max_traces_per_user: 1000
    global:
      max_bytes_per_trace: 2000000
